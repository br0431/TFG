{% if error %}
  <div class="advice-output">
    <p class="advice-error">{{ error }}</p>
  </div>

{% else %}
  <div class="advice-output">
    <p class="advice-rules-title">Recommended Actions</p>
    <ul class="advice-rules-list">
      {% for rule in rules %}
        <li>{{ rule }}</li>
      {% endfor %}
    </ul>

    <p class="advice-comp-title">Suggested Composition</p>
    <p class="advice-comp-text">{{ bot_response }}</p>
  </div>
{% endif %}
